name: Windows Host CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Windows Host
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S host
          -B host/build
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build
        run: cmake --build host/build --config Debug

      - name: Run smoke test
        run: ./host/build/Debug/RemoteCoreHost.exe
